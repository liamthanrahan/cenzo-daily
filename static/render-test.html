<!doctype html>
<!--
  Render test for the Seeedash HTML widget. Point the widget at
  https://liamthanrahan.github.io/cenzo-daily/render-test.html and refresh the device.
  Each line reports something about the renderer: whether JavaScript runs, its clock and
  time zone, whether a live fetch finishes, how long it waits, web fonts, size and greys.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800">
<title>Render test</title>
<style>
  @font-face { font-family: 'Masthead'; src: url('render-test-font.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; }
  body { width: 800px; height: 480px; overflow: hidden; font: 20px/1.25 Georgia, 'Times New Roman', serif; padding: 18px 24px; }
  h1 { margin: 0 0 4px; font: 400 44px/1 'Masthead', Georgia, serif; }
  #big { font: 700 38px/1.1 Arial, Helvetica, sans-serif; margin: 2px 0 10px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 3px 0; vertical-align: top; }
  td:first-child { width: 170px; font-weight: 700; }
  .no { font-weight: 700; }
  .greys { display: flex; gap: 0; margin-top: 10px; height: 40px; border: 2px solid #000; }
  .greys div { flex: 1; display: grid; place-items: center; font: 700 14px Arial, sans-serif; }
  .ramp { height: 18px; margin-top: 6px; border: 2px solid #000; background: linear-gradient(90deg, #000, #fff); }
  .small { font: 12px Arial, sans-serif; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Render test</h1>
  <div id="big">JavaScript did NOT run</div>
  <table>
    <tr><td>Renderer clock</td><td id="clock">–</td></tr>
    <tr><td>Live weather</td><td id="weather">– (needs JavaScript)</td></tr>
    <tr><td>Waited for</td><td id="timers">–</td></tr>
    <tr><td>Web font</td><td id="font">heading above should be blackletter</td></tr>
    <tr><td>Page size</td><td id="size">–</td></tr>
  </table>
  <div class="greys">
    <div style="background:#000;color:#fff">#000</div>
    <div style="background:#555;color:#fff">#555</div>
    <div style="background:#aaa;color:#000">#aaa</div>
    <div style="background:#fff;color:#000">#fff</div>
  </div>
  <div class="ramp"></div>
  <div class="small">12px text: the quick brown fox jumps over the lazy dog · 0123456789</div>

<script>
  const start = performance.now();
  const $ = (id) => document.getElementById(id);
  const sydney = (d, opts) => d.toLocaleString('en-AU', { timeZone: 'Australia/Sydney', ...opts });
  const now = new Date();

  // 1. JavaScript ran: show the render time in Sydney.
  $('big').textContent = 'JS ran · ' + sydney(now, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', second: '2-digit' });

  // 2. The renderer's own clock and time zone.
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  $('clock').textContent = `zone ${zone} · local ${now.toLocaleTimeString()} · UTC ${now.toISOString().slice(11, 19)}`;

  // 3. Size and pixel ratio the renderer uses.
  $('size').textContent = `${innerWidth} × ${innerHeight} @ ${devicePixelRatio}x · ${navigator.userAgent.match(/(HeadlessChrome|Chrome|Firefox|Safari)\/[\d.]+/)?.[0] ?? navigator.userAgent.slice(0, 40)}`;

  // 4. How long the renderer waits before taking its picture.
  const fired = [];
  $('timers').textContent = 'no timers fired yet (snapshot taken straight away)';
  for (const s of [1, 3, 10, 30]) {
    setTimeout(() => { fired.push(s + ' s'); $('timers').textContent = 'timers fired: ' + fired.join(', '); }, s * 1000);
  }

  // 5. A live fetch from Open-Meteo (what the real page would need).
  $('weather').textContent = 'fetch started, not finished when the picture was taken';
  fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.86&longitude=151.1&timezone=Australia%2FSydney&current=temperature_2m')
    .then((r) => r.json())
    .then((j) => {
      const ms = Math.round(performance.now() - start);
      $('weather').textContent = `Concord ${j.current.temperature_2m} °C at ${j.current.time.slice(11)} (took ${ms} ms)`;
    })
    .catch((e) => { $('weather').textContent = 'fetch failed: ' + e.message; });

  // 6. Did the web font load?
  document.fonts.load('44px Masthead').then((f) => {
    $('font').textContent = f.length ? 'loaded (heading is blackletter)' : 'did not load (heading is plain serif)';
  });
</script>
</body>
</html>
