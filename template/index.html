<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Cenzo Daily</title>
  <link rel="stylesheet" href="style.css">
  <!-- Open this file directly in a browser to edit the layout: it renders sample-data.js. -->
  <script src="sample-data.js"></script>
  <script src="render.js" defer></script>
</head>
<body>
  <main class="page">

    <header class="masthead">
      <div class="ear left"><span class="ear-k">Fondato nel</span><span class="ear-v">MMXXVI</span></div>
      <h1 id="masthead">The Cenzo Daily</h1>
      <div class="ear right"><span class="ear-k">Prezzo</span><span class="ear-v">un espresso</span></div>
    </header>

    <div class="dateline">
      <span id="issue">Vol. I · No. 1</span>
      <span class="dateline-date"><span id="date-en"></span> <span class="sep">·</span> <em id="date-it"></em></span>
      <span id="edition"></span>
    </div>

    <div class="columns">

      <!-- ===================== WEATHER ===================== -->
      <section class="weather">
        <div class="kicker">Il Meteo <span>· Weather</span></div>
        <h2 id="w-head" class="fit"><span id="w-headline">Headline</span></h2>

        <div class="w-main">
          <figure class="photo">
            <!--
              AVATAR
              Everything inside <g id="person"> is the likeness: swap it to change how he looks.
              Elements with data-moods="..." only show for those moods (see render.js).
              Moods: sunny partly cloudy fog rain storm snow hot cold windy unknown
            -->
            <svg id="avatar" viewBox="0 0 200 212" aria-label="Avatar">
              <defs>
                <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
                  <circle cx="3" cy="3" r="1.1" fill="#555"/>
                </pattern>
              </defs>
              <rect width="200" height="212" fill="url(#halftone)"/>

              <!-- Behind the person -->
              <g data-moods="rain" class="umbrella">
                <line x1="100" y1="2" x2="100" y2="70" stroke="#000" stroke-width="4"/>
                <path d="M12 64 Q100 -14 188 64 Q166 50 144 64 Q122 50 100 64 Q78 50 56 64 Q34 50 12 64 Z" fill="#555" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M100 6 Q74 30 56 64 M100 6 Q126 30 144 64" fill="none" stroke="#000" stroke-width="2.5"/>
              </g>
              <g data-moods="storm" class="umbrella-inside-out">
                <path d="M150 34 L150 92 Q150 104 140 104 Q132 104 132 96" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
                <path d="M110 6 Q150 58 190 6 Q180 16 170 6 Q160 16 150 6 Q140 16 130 6 Q120 16 110 6 Z" fill="#555" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M150 34 L130 7 M150 34 L170 7 M150 34 L150 7" stroke="#000" stroke-width="2.5"/>
              </g>
              <g data-moods="sunny hot" class="sun">
                <circle cx="168" cy="34" r="15" fill="#fff" stroke="#000" stroke-width="3.5"/>
                <g stroke="#000" stroke-width="3.5" stroke-linecap="round">
                  <line x1="168" y1="8" x2="168" y2="13"/><line x1="168" y1="55" x2="168" y2="60"/>
                  <line x1="142" y1="34" x2="147" y2="34"/><line x1="189" y1="34" x2="194" y2="34"/>
                  <line x1="150" y1="16" x2="153" y2="19"/><line x1="183" y1="49" x2="186" y2="52"/>
                  <line x1="150" y1="52" x2="153" y2="49"/><line x1="183" y1="19" x2="186" y2="16"/>
                </g>
              </g>
              <g data-moods="partly" class="sun-small">
                <circle cx="160" cy="28" r="12" fill="#fff" stroke="#000" stroke-width="3"/>
                <g stroke="#000" stroke-width="3" stroke-linecap="round">
                  <line x1="160" y1="6" x2="160" y2="10"/><line x1="138" y1="28" x2="142" y2="28"/>
                  <line x1="144" y1="12" x2="147" y2="15"/><line x1="176" y1="12" x2="173" y2="15"/>
                </g>
              </g>
              <g data-moods="partly cloudy unknown" class="cloud-right">
                <path d="M150 58 H186 A10 10 0 0 0 184 38 A14 14 0 0 0 158 38 A10 10 0 0 0 150 58 Z" fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
              </g>
              <g data-moods="cloudy" class="cloud-left">
                <path d="M10 46 H44 A9 9 0 0 0 42 28 A13 13 0 0 0 18 28 A9 9 0 0 0 10 46 Z" fill="#aaa" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
              </g>
              <g data-moods="storm" class="bolt">
                <path d="M34 8 L56 8 L44 36 L60 36 L24 84 L34 48 L18 48 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
              </g>
              <g data-moods="windy" class="wind" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round">
                <path d="M6 44 H40 Q52 44 52 34 Q52 26 44 26"/>
                <path d="M6 64 H30"/>
                <path d="M164 150 H192"/>
                <path d="M150 172 H180 Q190 172 190 182 Q190 190 182 190"/>
              </g>

              <!-- THE PERSON: Cenzo. Short dark hair swept back, faded sides, full beard, big grin, black shirt. -->
              <g id="person">
                <!-- neck -->
                <rect x="86" y="132" width="28" height="40" fill="#fff" stroke="#000" stroke-width="4"/>
                <!-- black camp-collar shirt -->
                <path d="M24 212 C26 178 58 164 100 164 C142 164 174 178 176 212 Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
                <path d="M86 164 L100 186 L114 164 Z" fill="#fff"/>
                <path d="M86 162 L70 176 L98 186 Z M114 162 L130 176 L102 186 Z" fill="#000" stroke="#aaa" stroke-width="2.5" stroke-linejoin="round"/>
                <circle cx="100" cy="200" r="2.5" fill="#555"/>
                <!-- ears -->
                <ellipse cx="60" cy="106" rx="8" ry="12" fill="#fff" stroke="#000" stroke-width="3.5"/>
                <ellipse cx="140" cy="106" rx="8" ry="12" fill="#fff" stroke="#000" stroke-width="3.5"/>
                <!-- face -->
                <ellipse cx="100" cy="104" rx="40" ry="50" fill="#fff" stroke="#000" stroke-width="4"/>
                <!-- full beard and moustache -->
                <path d="M60.5 96 L67 96 C68 112 74 121 85 124 Q100 119 115 124 C126 121 132 112 133 96 L139.5 96 C140 134 128 160 100 162 C72 160 60 134 60.5 96 Z" fill="#555" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
                <!-- hair: faded sides, darker swept-back top with a side part -->
                <path d="M58 100 C54 66 74 50 100 50 C126 50 146 66 142 100 C139 88 135 81 132 77 L68 77 C65 81 61 88 58 100 Z" fill="#555" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
                <path d="M64 80 C60 56 80 42 98 40 C104 34 120 34 128 40 C140 46 144 58 141 78 C132 70 118 66 104 68 C90 67 74 71 64 80 Z" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
                <path d="M80 72 C80 62 84 54 90 48" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M96 64 Q110 50 130 52 M104 67 Q118 58 136 62" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
                <g data-moods="windy" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round">
                  <path d="M136 60 Q156 46 180 52 Q160 56 148 72 Z"/>
                  <path d="M126 48 Q146 30 170 32 Q152 40 142 56 Z"/>
                </g>
                <!-- thick brows -->
                <path d="M74 92 Q86 85 97 88 L96 93 Q86 90 75 96 Z" fill="#000"/>
                <path d="M126 92 Q114 85 103 88 L104 93 Q114 90 125 96 Z" fill="#000"/>
                <!-- nose -->
                <path d="M101 96 L95 118 Q99 123 107 119" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <g data-hide-moods="sunny hot">
                  <circle cx="86" cy="104" r="4.5" fill="#000"/>
                  <circle cx="114" cy="104" r="4.5" fill="#000"/>
                </g>
                <g data-hide-moods="storm windy fog unknown sunny hot" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round">
                  <path d="M73 106 L69 104 M73 110 L69 111 M127 106 L131 104 M127 110 L131 111"/>
                </g>
                <g data-moods="cold snow">
                  <circle cx="74" cy="114" r="6" fill="#aaa"/>
                  <circle cx="126" cy="114" r="6" fill="#aaa"/>
                </g>
                <!-- Mouths: his big toothy grin by default -->
                <g data-hide-moods="storm windy fog unknown">
                  <path d="M82 131 Q100 133 118 131 Q114 150 100 151 Q86 150 82 131 Z" fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
                  <path d="M84 137 Q100 139 116 137" fill="none" stroke="#aaa" stroke-width="2"/>
                </g>
                <ellipse data-moods="storm windy" cx="100" cy="139" rx="8" ry="10" fill="#000" stroke="#fff" stroke-width="2"/>
                <path data-moods="fog unknown" d="M88 138 H112" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
              </g>

              <!-- His trademark peace sign, on sunny days -->
              <g data-moods="sunny" class="peace">
                <path d="M14 212 L18 184 L52 184 L56 212 Z" fill="#000" stroke="#000" stroke-width="3"/>
                <rect x="18" y="104" width="11" height="48" rx="5.5" fill="#fff" stroke="#000" stroke-width="3" transform="rotate(-20 23 150)"/>
                <rect x="33" y="102" width="11" height="50" rx="5.5" fill="#fff" stroke="#000" stroke-width="3" transform="rotate(14 38 150)"/>
                <rect x="16" y="142" width="38" height="44" rx="11" fill="#fff" stroke="#000" stroke-width="3"/>
                <path d="M24 158 Q36 152 46 160 M24 168 Q34 164 44 170" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
              </g>

              <!-- In front of the person -->
              <g data-moods="sunny hot" class="sunnies">
                <path d="M58 100 L72 102 M128 102 L142 100" stroke="#000" stroke-width="3.5"/>
                <rect x="70" y="97" width="27" height="17" rx="6" fill="#000"/>
                <rect x="103" y="97" width="27" height="17" rx="6" fill="#000"/>
                <path d="M97 103 Q100 100 103 103" fill="none" stroke="#000" stroke-width="3.5"/>
                <path d="M76 101 L84 101" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M109 101 L117 101" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"/>
              </g>
              <g data-moods="hot" class="sweat" fill="#fff" stroke="#000" stroke-width="2.5">
                <path d="M146 72 Q154 84 146 90 Q138 84 146 72 Z"/>
                <path d="M50 78 Q56 88 50 92 Q44 88 50 78 Z"/>
              </g>
              <g data-moods="cold snow" class="beanie">
                <path d="M56 90 C54 40 146 40 144 90 Z" fill="#555" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M70 52 L70 86 M85 46 L85 86 M100 44 L100 86 M115 46 L115 86 M130 52 L130 86" stroke="#000" stroke-width="1.5" opacity=".6"/>
                <rect x="52" y="78" width="96" height="16" rx="7" fill="#aaa" stroke="#000" stroke-width="3.5"/>
                <circle cx="100" cy="36" r="10" fill="#aaa" stroke="#000" stroke-width="3.5"/>
              </g>
              <g data-moods="cold snow" class="scarf">
                <path d="M64 150 Q100 170 136 150 L140 170 Q100 192 60 170 Z" fill="#555" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M112 174 L132 174 L138 212 L114 212 Z" fill="#555" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M118 190 H134 M120 202 H136" stroke="#aaa" stroke-width="3"/>
              </g>
              <g data-moods="rain" class="drops" stroke="#000" stroke-width="3.5" stroke-linecap="round">
                <line x1="20" y1="80" x2="16" y2="92"/><line x1="36" y1="102" x2="32" y2="114"/>
                <line x1="14" y1="124" x2="10" y2="136"/><line x1="178" y1="82" x2="174" y2="94"/>
                <line x1="190" y1="108" x2="186" y2="120"/><line x1="168" y1="128" x2="164" y2="140"/>
              </g>
              <g data-moods="storm" class="drops" stroke="#000" stroke-width="3.5" stroke-linecap="round">
                <line x1="14" y1="104" x2="4" y2="116"/><line x1="34" y1="124" x2="24" y2="136"/>
                <line x1="178" y1="110" x2="168" y2="122"/><line x1="192" y1="134" x2="182" y2="146"/>
              </g>
              <g data-moods="snow" class="flakes" stroke="#000" stroke-width="3" stroke-linecap="round">
                <path d="M22 30 v14 M15 37 h14 M17 32 l10 10 M27 32 l-10 10"/>
                <path d="M176 24 v14 M169 31 h14 M171 26 l10 10 M181 26 l-10 10"/>
                <path d="M20 120 v10 M15 125 h10"/>
                <path d="M182 120 v10 M177 125 h10"/>
              </g>
              <g data-moods="fog" class="fog" stroke="#aaa" stroke-width="9" stroke-linecap="round">
                <line x1="8" y1="40" x2="70" y2="40"/><line x1="130" y1="30" x2="192" y2="30"/>
                <line x1="18" y1="158" x2="88" y2="158"/><line x1="112" y1="176" x2="190" y2="176"/>
              </g>
            </svg>
            <!-- Artwork from avatars/source/ replaces the drawing when there is some for today's mood -->
            <img id="avatar-img" alt="" width="138" height="146" hidden>
            <figcaption id="w-caption">Caption</figcaption>
          </figure>

          <div class="w-now">
            <!-- Sky icons: glyphs from the Weather Icons font by Erik Flowers (SIL OFL 1.1).
                 render.js shows the one whose data-icons matches today's sky. -->
            <div id="sky-icon" aria-hidden="true">
              <span data-icons="sun">&#xf00d;</span>
              <span data-icons="partly">&#xf002;</span>
              <span data-icons="cloud">&#xf013;</span>
              <span data-icons="fog">&#xf014;</span>
              <span data-icons="rain">&#xf019;</span>
              <span data-icons="storm">&#xf01e;</span>
              <span data-icons="snow">&#xf01b;</span>
            </div>
            <div class="temp"><span id="t-max">–</span><span class="deg">°</span></div>
            <div class="tmin">min <span id="t-min">–</span>°</div>
            <div class="cond" id="cond-en">–</div>
            <div class="cond-it" id="cond-it">–</div>
          </div>
        </div>

        <table class="stats">
          <tr>
            <td><span class="label">Pioggia</span><span class="label-en">Rain</span><b id="s-rain">–</b></td>
            <td><span class="label">Indice UV</span><b id="s-uv">–</b> <i id="s-uv-band"></i></td>
          </tr>
          <tr>
            <td><span class="label">Alba</span><span class="label-en">Sunrise</span><b id="s-sunrise">–</b></td>
            <td><span class="label">Tramonto</span><span class="label-en">Sunset</span><b id="s-sunset">–</b></td>
          </tr>
        </table>
      </section>

      <!-- ===================== STORY ===================== -->
      <section class="story">
        <div class="kicker">Dagli Archivi <span>· From the Archives</span></div>
        <h2 id="f-head" class="fit"><span id="f-title">Title</span></h2>
        <div class="story-dateline" id="f-dateline">Rome · 753 BC</div>
        <div class="story-body fit" id="f-body"><p id="f-text"></p></div>
      </section>
    </div>

    <footer class="footer">
      <span>Previsioni: Open-Meteo</span>
      <span id="printed">Stampato alle 5:30 am</span>
      <span id="f-number">Storia 1 di 110</span>
    </footer>
  </main>
</body>
</html>
