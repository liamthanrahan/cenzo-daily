name: Print today's paper

on:
  schedule:
    # Once a day, the evening before, Sydney time. GitHub has been starting this
    # repo's scheduled runs about 7-9 hours late, so this lands in the early morning.
    # Runs from 6 pm onwards print the next day's paper, so an on-time run is fine too.
    # (Minute 23 on purpose: GitHub is busiest on the hour.)
    - cron: "23 21 * * *"
      timezone: "Australia/Sydney"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # only used by the keep-alive step below

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Google Chrome comes preinstalled on GitHub's Ubuntu runners.
      - name: Print the front page
        run: npm run build
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      # GitHub switches off scheduled workflows in repos with no activity for 60 days.
      # Re-enabling the workflow on each scheduled run keeps the paper printing.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
